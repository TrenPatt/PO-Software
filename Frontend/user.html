<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="header"></div>

    <main class="page-main">
        <section class="page-banner user-banner">
            <div>
                <p class="eyebrow">Administration</p>
                <h1>User Management</h1>
            </div>
            <button id="openUserForm" type="button" class="primary-button">+ Add User</button>
        </section>

        <section class="user-toolbar">
            <input id="userSearch" type="search" placeholder="Search by username or role" aria-label="Search users">
            <button id="searchUsers" type="button" class="secondary-button">Search</button>
        </section>

        <section id="userFormPanel" class="user-form-panel hidden">
            <h2>Create User</h2>
            <form id="userForm" class="user-form" novalidate>
                <div class="input-group">
                    <label for="newUsername">Username</label>
                    <input id="newUsername" name="username" type="text" required>
                </div>
                <div class="input-group">
                    <label for="newPassword">Initial Password</label>
                    <input id="newPassword" name="password" type="password" required>
                </div>
                <div class="input-group">
                    <label for="newRole">Role</label>
                    <select id="newRole" name="role">
                        <option value="requestor">requestor</option>
                        <option value="approver">approver</option>
                        <option value="admin">admin</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="newDepartment">
                        Department (required for requestors/approvers)
                    </label>

                    <input
                        id="newDepartment"
                        name="department"
                        type="text"
                        maxlength="60"
                        placeholder="e.g. Finance">
                </div>
                <button type="submit" class="primary-button">Create User</button>
                <p id="userFormMessage" class="form-message" aria-live="polite"></p>
            </form>
        </section>

        <section class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Role</th>
                        <th>Department</th>
                        <th>Status</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr>
                        <td colspan="6">Loading users...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
